<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Employees</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-container">

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">E</div>
            <div>
                <h2>EmployeeHub</h2>
                <p>Employee Management System</p>
            </div>
        </div>

        <div class="actions">
            <a class="btn btn-secondary" th:href="@{/employees/list}">
                ← Employee List
            </a>

            <a class="btn btn-primary" th:href="@{/employees/add}">
                + Add Employee
            </a>
        </div>
    </header>

    <section class="page-heading">
        <h1>Search Employees</h1>
        <p>Find employees by their name or department.</p>
    </section>

    <section class="card">
        <h2 class="section-title">Search Filters</h2>

        <form th:action="@{/employees/search}" method="get">

            <div class="search-grid">

                <div class="form-group">
                    <label for="name">Employee Name</label>
                    <input id="name"
                           type="text"
                           name="name"
                           th:value="${name}"
                           placeholder="Enter employee name">
                </div>

                <div class="form-group">
                    <label for="departmentId">Department</label>
                    <select id="departmentId" name="departmentId">
                        <option value="">All Departments</option>

                        <option th:each="department : ${departments}"
                                th:value="${department.id}"
                                th:text="${department.name}"
                                th:selected="${departmentId != null and departmentId == department.id}">
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit" class="btn btn-primary">
                        Search
                    </button>
                </div>

            </div>

        </form>
    </section>

    <section class="card" style="margin-top: 24px;">

        <h2 class="section-title">
            Search Results
            (<span th:text="${#lists.size(employees)}">0</span>)
        </h2>

        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Employee ID</th>
                    <th>Full Name</th>
                    <th>Email Address</th>
                    <th>Department</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="employee : ${employees}">
                    <td class="employee-id" th:text="${employee.id}"></td>
                    <td class="employee-name" th:text="${employee.name}"></td>
                    <td th:text="${employee.email}"></td>
                    <td>
                        <span class="department-badge"
                              th:text="${employee.department.name}">
                        </span>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="4" class="empty-state">
                        No matching employees found.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

    </section>

</div>

</body>
</html>
