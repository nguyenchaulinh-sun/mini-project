
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="page-container">

    <header class="topbar">
        <div class="brand">
            <div class="brand-icon">E</div>
            <div>
                <h2>EmployeeHub</h2>
                <p>Employee Management System</p>
            </div>
        </div>

        <div class="actions">
            <span>
                Welcome,
                <strong sec:authentication="name">username</strong>
            </span>

            <span class="department-badge"
                  sec:authorize="hasRole('ADMIN')">
                ADMIN
            </span>

            <a class="btn btn-secondary"
               th:href="@{/employees/list}">
                ← Back to Employees
            </a>

            <form th:action="@{/logout}" method="post">
                <button type="submit" class="btn btn-secondary">
                    Logout
                </button>
            </form>
        </div>
    </header>

    <section class="page-heading">
        <h1>Add New Employee</h1>
        <p>Enter employee information to add a new member to your organization.</p>
    </section>

    <div th:if="${errorMessage}"
         class="alert-error"
         th:text="${errorMessage}">
    </div>

    <section class="card form-card">

        <h2 class="section-title">Employee Information</h2>

        <form th:action="@{/employees/add}"
              th:object="${employeeRequest}"
              method="post">

            <div class="form-grid">

                <div class="form-group full-width">
                    <label for="name">Full Name</label>
                    <input id="name"
                           type="text"
                           th:field="*{name}"
                           placeholder="Enter employee full name"
                           required>
                </div>

                <div class="form-group full-width">
                    <label for="email">Email Address</label>
                    <input id="email"
                           type="email"
                           th:field="*{email}"
                           placeholder="example@company.com"
                           required>
                </div>

                <div class="form-group full-width">
                    <label for="departmentId">Department</label>
                    <select id="departmentId"
                            th:field="*{departmentId}"
                            required>
                        <option value="">Select a department</option>

                        <option th:each="department : ${departments}"
                                th:value="${department.id}"
                                th:text="${department.name}">
                        </option>
                    </select>
                </div>

            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    Save Employee
                </button>

                <a th:href="@{/employees/list}"
                   class="btn btn-secondary">
                    Cancel
                </a>
            </div>

        </form>

    </section>

</div>

</body>
</html>
